# Tyse Scrutiny - Shared Infrastructure
# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
#
# Start all shared services:
#   docker compose up -d
#
# Stop all shared services:
#   docker compose down
#
# All microservices (gateway, divipol, scrutiny, notification, mock) connect to these services.
# Do NOT start Consul or Kafka from individual microservice docker-compose files.

name: tyse-infrastructure

services:
  consul:
    image: docker.io/hashicorp/consul:1.21.0
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:8300:8300
      - 127.0.0.1:8500:8500
      - 127.0.0.1:8600:8600
    command: consul agent -dev -ui -client 0.0.0.0 -log-level=INFO
    labels:
      org.springframework.boot.ignore: true

  consul-config-loader:
    image: jhipster/consul-config-loader:v0.4.1
    volumes:
      - ./consul/central-server-config:/config
    environment:
      - INIT_SLEEP_SECONDS=5
      - CONSUL_URL=consul
      - CONSUL_PORT=8500
    depends_on:
      - consul
    labels:
      org.springframework.boot.ignore: true

  kafka:
    image: apache/kafka:latest
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Topics are auto-created when first used by producers/consumers
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    volumes:
      - kafka-data:/var/lib/kafka/data
    labels:
      org.springframework.boot.ignore: true

  minio:
    image: minio/minio:latest
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:9000:9000   # S3 API
      - 127.0.0.1:9001:9001   # Console UI
    environment:
      MINIO_ROOT_USER: tyseadmin
      MINIO_ROOT_PASSWORD: tyseadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    labels:
      org.springframework.boot.ignore: true

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ['/bin/sh', '-c']
    command: |
      "
      echo 'Waiting for MinIO to be ready...'
      sleep 5

      mc alias set tyse http://minio:9000 tyseadmin tyseadmin123

      echo 'Creating buckets...'
      mc mb --ignore-existing tyse/e14-pdfs
      mc mb --ignore-existing tyse/e14-processed

      echo 'MinIO buckets created successfully.'
      "
    labels:
      org.springframework.boot.ignore: true

  mailhog:
    image: mailhog/mailhog:v1.0.1
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 127.0.0.1:1025:1025   # SMTP server
      - 127.0.0.1:8025:8025   # Web UI
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:8025']
      interval: 5s
      timeout: 5s
      retries: 10
    labels:
      org.springframework.boot.ignore: true

volumes:
  minio-data:
  kafka-data:
